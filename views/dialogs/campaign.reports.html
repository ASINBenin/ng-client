<md-dialog md-theme="light" class="dialog-width">
    <md-toolbar>
        <div class="md-toolbar-tools">
            <h2>{{ 'Reports sent to the BackOffice' | translate }} : {{ anr.label }}</h2>
            <span flex></span>
            <md-button class="md-icon-button" ng-click="close()">
                <md-icon aria-label="{{ 'Close dialog' | translate }}">close</md-icon>
            </md-button>
        </div>
    </md-toolbar>
    <md-dialog-content>
        <div class="md-dialog-content" layout="column">
            <campaign-reports anr="anr" can-submit="canSubmit" requires-signature="requiresSignature"></campaign-reports>
        </div>
    </md-dialog-content>
    <md-dialog-actions>
        <md-button ng-click="close()">{{ 'Close' | translate }}</md-button>
    </md-dialog-actions>
</md-dialog>
